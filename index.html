<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Execution</title>
<style>
:root{--bg:#f3f0e8;--card:#fff;--ink:#1d1c1a;--mut:#7a746b;--line:#e8e3d9;--hero1:#1f3d2e;--hero2:#2f6b4b;--sh:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(50,35,10,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d110f;--card:#161c19;--ink:#f0eee8;--mut:#98a09a;--line:#242c28;--hero1:#10281c;--hero2:#1f5238;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d110f;--card:#161c19;--ink:#f0eee8;--mut:#98a09a;--line:#242c28;--hero1:#10281c;--hero2:#1f5238;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit;touch-action:manipulation}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.ring{position:relative;width:132px;height:132px}.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:34px;font-weight:800;letter-spacing:-1px}
.ring .n small{display:block;font-size:11px;font-weight:600;opacity:.7;letter-spacing:.5px;text-transform:uppercase}
.eye{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;opacity:.75;font-weight:700}
h1{margin:2px 0 8px;font-size:26px;letter-spacing:-.5px;line-height:1.15}
.next{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.next .t{flex:1;min-width:0}.next b{display:block;font-size:17px}.next span{font-size:13.5px;opacity:.92}
.go{background:#fff;color:#14402a;border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:800;cursor:pointer;white-space:nowrap}
.go:active{transform:scale(.95)}
.week{display:flex;gap:8px;margin:14px 0}
.day{flex:1;background:var(--card);border:2px solid transparent;border-radius:18px;padding:9px 4px;text-align:center;box-shadow:var(--sh);cursor:pointer;min-height:64px}
.day.sel{border-color:#2f9e63}.day small{display:block;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.day b{font-size:17px}.day i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#2f9e63}
.grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:start}}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.side{position:sticky;top:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;margin:20px 6px 8px}
.ph:first-child{margin-top:4px}
.ph h2{margin:0;font-size:19px;letter-spacing:-.3px}.ph span{font-size:12.5px;color:var(--mut);font-weight:600}
.ph.full span{color:#2f9e63}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;min-height:64px;border-left:5px solid var(--g);transition:opacity .2s,transform .12s}
.it:active{transform:scale(.985)}
.it.dim{opacity:.3}
.ck{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:.2s}
.ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s .05s}
.it.on .ck{background:var(--g);border-color:var(--g)}.it.on .ck svg{stroke-dashoffset:0}
.it.pop .ck{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1)}}
.tm{flex:none;width:62px;font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.bd{flex:1;min-width:0}.bd b{display:block;font-size:16px}.it.on .bd b{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}
.why{display:block;font-size:13.5px;color:var(--mut)}.why:before{content:"Why · ";color:var(--g);font-weight:800}
.chip{flex:none;font-size:11px;font-weight:800;color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent);border-radius:99px;padding:4px 9px;white-space:nowrap}
@media(max-width:560px){.chip{display:none}.tm{width:54px}}
.goal{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer}
.goal.f{border-color:var(--g)}
.goal .r{display:flex;justify-content:space-between;font-weight:700;font-size:14px}.goal .r span{color:var(--mut);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.mrow{display:flex;align-items:center;gap:10px;margin:10px 0;justify-content:space-between}
.mrow label{font-weight:700;font-size:14px}.mrow label small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.mood{display:flex;gap:4px}.mood button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:none;font-size:20px;cursor:pointer;filter:grayscale(1);opacity:.6}
.mood button.s{filter:none;opacity:1;border-color:#8b5cf6;background:rgba(139,92,246,.12)}
.num{width:96px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:17px}
.yn{display:flex;gap:4px}.yn button,.nd button{height:44px;border-radius:12px;border:2px solid var(--line);background:none;padding:0 14px;font-weight:700;cursor:pointer}
.yn button.s{background:#64748b;color:#fff;border-color:#64748b}
.nd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.nd button{padding:0;height:54px;font-size:15px}.nd button.s{background:#c2410c;color:#fff;border-color:#c2410c}
.hint{font-size:12px;color:var(--mut);margin:6px 2px 0}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:50}
.fx i{position:fixed;width:9px;height:14px;border-radius:2px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#14402a;color:#fff;border-radius:99px;padding:13px 22px;font-weight:800;transition:transform .35s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
</style></head><body><div class="wrap">
<div class="hero"><div class="ring" id="ring"></div>
<div style="position:relative;z-index:1"><div class="eye" id="eye"></div><h1 id="msg"></h1><div id="next"></div></div></div>
<div class="week" id="week"></div>
<div class="grid"><div id="list"></div>
<div class="side"><div class="card"><h3>Every action feeds a goal</h3><div class="hint" style="margin:0 0 6px">Tap a goal to spotlight its actions.</div><div id="goals"></div></div>
<div class="card"><h3>Today’s metrics</h3><div id="metrics"></div></div>
<div class="card"><h3>To not do</h3><div class="nd" id="nd"></div><div class="hint">Tap each one you held the line on today.</div></div></div></div>
<div class="hint" style="text-align:center;margin-top:18px">Progress saves automatically on this device.</div></div>
<div class="toast" id="toast"></div>
<script>
var G={P:['Physical Shape','#ea6a12'],M:['Emotional Stability','#8b5cf6'],$:['Money','#c9961a'],X:['Performance','#0891b2'],H:['Maintenance','#64748b'],E:['Education','#3b6fe0']};
var I=[
['4:30 AM','Kick Start','Wake up with one alarm','Win the first decision of the day: no snooze','X'],
['4:31 AM','Kick Start','Drink water','To hydrate','P'],
['4:32 AM','Kick Start','PPA','To get the blood flowing','P'],
['4:35 AM','Kick Start','Cold rinse','To awaken','M'],
['4:40 AM','Kick Start','Stretch','Get the body ready for the day','P'],
['4:45 AM','The Quiet','Overnight oats','Weight gain','P'],
['4:50 AM','The Quiet','Meditate','Mental prep + a clear mind','M'],
['5:00 AM','Workout Prep','Lemon-honey water','Energy','P'],
['5:05 AM','Workout Prep','Make shake','Weight gain','P'],
['5:15 AM','Gym','Selfie','Progress measurement','P'],
['5:20 AM','Gym','Cold plunge, 1 min','Cold exposure for 1 minute','P'],
['5:30 AM','Gym','Jump rope, 10 min','10 minutes of conditioning','P'],
['5:40 AM','Gym','Workout','Weight gain','P'],
['6:40 AM','Gym','Drink shake','Weight gain','P'],
['6:45 AM','Gym','Sauna','Cardiovascular health','P'],
['7:15 AM','Gym','Shower','Recover and reset','P'],
['7:20 AM','Gym','Selfie','Progress measurement','P'],
['7:30 AM','Fuel','Breakfast','Weight gain','P'],
['7:45 AM','Fuel','Coffee','Reward','M'],
['9:00 AM','Work Block','Work to-do list by account / pursuit','Manage workload and expectations, to make money','$'],
['12:00 PM','Midday','PPA','Weight gain','P'],
['12:15 PM','Midday','Lunch','Weight gain','P'],
['1:00 PM','Work Block','Work','To make money','$'],
['2:45 PM','Afternoon','PPA','Weight gain','P'],
['3:00 PM','Afternoon','Smoothie + walk','Weight gain','P'],
['4:00 PM','Work Block','Work','To make money','$'],
['6:00 PM','Evening','Walk','Environment change','M'],
['7:00 PM','Evening','Dinner','Weight gain','P'],
['8:00 PM','Slow Down','Execution evaluation + reasons','To achieve goals (weight, mood, behavior)','X'],
['9:00 PM','Slow Down','Make list','To achieve goals','X'],
['10:00 PM','Slow Down','Shower, lotion, teeth','Hygiene','H'],
['11:00 PM','Slow Down','Read','To learn and get ready for sleep','E']];
var KEY='daily-exec-v1',S={},sel,focus=null;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
var days=[0,1,2,3,4].map(function(i){return new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)});
sel=ds(now);if(dow>4)sel=ds(days[4]);
function D(k){k=k||sel;return S[k]||(S[k]={done:{},m:{},n:{}})}
function cnt(k){return Object.keys((S[k]||{done:{}}).done).length}
function pct(k){return Math.round(cnt(k)/I.length*100)}
function $(id){return document.getElementById(id)}
function boom(big){var c=['#ea6a12','#8b5cf6','#c9961a','#0891b2','#3b6fe0','#2f9e63'],n=big?70:26,h='';
var f=document.createElement('div');f.className='fx';
for(var i=0;i<n;i++){var a=Math.random()*6.28,d=(big?260:150)*(.4+Math.random());
h+='<i style="left:'+(innerWidth/2)+'px;top:'+(innerHeight*.4)+'px;background:'+c[i%6]+';--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d+60)+'px;--r:'+Math.random()*720+'deg"></i>'}
f.innerHTML=h;document.body.appendChild(f);setTimeout(function(){f.remove()},1300)}
var tt;function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show')},2300)}
function toggle(i){var d=D(),was=!!d.done[i];if(was)delete d.done[i];else d.done[i]=1;save();
if(!was){var b=I[i][1],all=I.every(function(x,j){return x[1]!=b||d.done[j]});
if(cnt(sel)===I.length){boom(1);toast('Perfect day. Every box checked.')}
else if(all&&!I.some(function(x,j){return x[1]==b&&!d.done[j]})&&I.filter(function(x){return x[1]==b}).length>1){boom();toast(b+' complete')}}
render(i)}
function render(pop){var d=D(),p=pct(sel),done=cnt(sel),C=2*Math.PI*56;
$('ring').innerHTML='<svg width="132" height="132"><circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="11"/><circle cx="66" cy="66" r="56" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p/100)+'" style="transition:stroke-dashoffset .6s"/></svg><div class="n"><div>'+p+'%<small>'+done+' of '+I.length+'</small></div></div>';
var dt=new Date(sel+'T12:00:00');$('eye').textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
$('msg').textContent=p==100?'A perfect day. You did it all.':p>=75?'Finish line in sight. Keep going.':p>=40?'Momentum is building.':p>0?'Good start. Keep stacking checks.':'Every check is a vote for who you’re becoming.';
var ni=-1;for(var i=0;i<I.length;i++)if(!d.done[i]){ni=i;break}
$('next').innerHTML=ni<0?'<div class="next"><div class="t"><b>Day complete</b><span>Log your metrics, then rest well.</span></div></div>':'<div class="next"><div class="t"><span>Up next · '+I[ni][0]+'</span><b>'+I[ni][2]+'</b><span>Why: '+I[ni][3]+' → '+G[I[ni][4]][0]+'</span></div><button class="go" data-n="'+ni+'">Done ✓</button></div>';
$('week').innerHTML=days.map(function(x){var k=ds(x);return '<div class="day'+(k==sel?' sel':'')+'" data-d="'+k+'"><small>'+x.toLocaleDateString('en-US',{weekday:'short'})+'</small><b>'+x.getDate()+'</b><i>'+(cnt(k)?pct(k)+'%':'·')+'</i></div>'}).join('');
var h='',last='';I.forEach(function(x,i){if(x[1]!=last){last=x[1];var idx=[];I.forEach(function(y,j){if(y[1]==last)idx.push(j)});var dn=idx.filter(function(j){return d.done[j]}).length;
h+='<div class="ph'+(dn==idx.length?' full':'')+'"><h2>'+last+'</h2><span>'+(dn==idx.length?'✓ Complete':dn+' / '+idx.length)+'</span></div>'}
h+='<div class="it'+(d.done[i]?' on':'')+(i===pop&&d.done[i]?' pop':'')+(focus&&focus!=x[4]?' dim':'')+'" data-i="'+i+'" style="--g:'+G[x[4]][1]+'"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="tm">'+x[0]+'</div><div class="bd"><b>'+x[2]+'</b><span class="why">'+x[3]+'</span></div><span class="chip">'+G[x[4]][0]+'</span></div>'});
$('list').innerHTML=h;
$('goals').innerHTML=Object.keys(G).map(function(g){var t=0,n=0;I.forEach(function(x,i){if(x[4]==g){t++;if(d.done[i])n++}});
return '<button class="goal'+(focus==g?' f':'')+'" data-g="'+g+'" style="--g:'+G[g][1]+'"><div class="r">'+G[g][0]+'<span>'+n+'/'+t+'</span></div><div class="bar"><i style="width:'+n/t*100+'%"></i></div></button>'}).join('');
var m=d.m,mo=['😞','🙁','😐','🙂','😄'];
$('metrics').innerHTML='<div class="mrow"><label>Mood<small>Emotional Stability</small></label><div class="mood">'+mo.map(function(e,i){return '<button data-mood="'+(i+1)+'" class="'+(m.mood==i+1?'s':'')+'">'+e+'</button>'}).join('')+'</div></div>'+
'<div class="mrow"><label>Weight<small>Physical Shape</small></label><input class="num" id="wt" inputmode="decimal" placeholder="lbs" value="'+(m.wt||'')+'"></div>'+
'<div class="mrow"><label>Pages<small>Education</small></label><input class="num" id="pg" inputmode="numeric" placeholder="read" value="'+(m.pg||'')+'"></div>'+
'<div class="mrow"><label>Maintenance<small>Done?</small></label><div class="yn"><button data-yn="1" class="'+(m.yn==='1'?'s':'')+'">Yes</button><button data-yn="0" class="'+(m.yn==='0'?'s':'')+'">No</button></div></div>';
$('nd').innerHTML=['S','P','A','D'].map(function(k){return '<button data-nd="'+k+'" class="'+(d.n[k]?'s':'')+'">No '+k+(d.n[k]?' ✓':'')+'</button>'}).join('')}
document.addEventListener('click',function(e){var t=e.target,x;
if(x=t.closest('.go'))return toggle(+x.dataset.n);
if(x=t.closest('.it'))return toggle(+x.dataset.i);
if(x=t.closest('.day')){sel=x.dataset.d;return render()}
if(x=t.closest('.goal')){focus=focus==x.dataset.g?null:x.dataset.g;return render()}
if(x=t.closest('[data-mood]')){var d=D();d.m.mood=d.m.mood==+x.dataset.mood?0:+x.dataset.mood;save();return render()}
if(x=t.closest('[data-yn]')){var d2=D();d2.m.yn=d2.m.yn===x.dataset.yn?'':x.dataset.yn;save();return render()}
if(x=t.closest('[data-nd]')){var d3=D(),k=x.dataset.nd;if(d3.n[k])delete d3.n[k];else d3.n[k]=1;save();return render()}});
document.addEventListener('change',function(e){var d=D();if(e.target.id=='wt'){d.m.wt=e.target.value;save()}if(e.target.id=='pg'){d.m.pg=e.target.value;save()}});
render();
</script></body></html>
